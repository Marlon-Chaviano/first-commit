# End-to-end tests (Playwright) against the production build, with no database or Redis:
# home and search, the configurator, the events API, the 404 page and phone layouts.
name: E2E

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/schema/**", "registry/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["apps/web/**", "packages/schema/**", "registry/**", ".github/workflows/e2e.yml"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
